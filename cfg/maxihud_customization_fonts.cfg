//======================================================================================================================================================================================================================
// FONT
//======================================================================================================================================================================================================================
alias "m0_font_clear"						"sixense_clear_bindings; sixense_write_bindings maxihud/maxi_font.txt"
alias "m0_font_log"							"con_logfile cfg/maxihud/maxi_font.txt"
//-----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------

alias "m0_font_surface"						"m0_font_clear; m0_font_log; echo #base ../../custom/maxihud/resource/scheme/fonts/fonts_customization/fonts_surface.res; console_unlog"
alias "m0_font_surface_semibold"			"m0_font_clear; m0_font_log; echo #base ../../custom/maxihud/resource/scheme/fonts/fonts_customization/fonts_surface_semibold.res; console_unlog"