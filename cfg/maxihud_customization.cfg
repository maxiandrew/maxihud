//======================================================================================================================================================================================================================
// Make sure the time stamp is not included when printing lines
//======================================================================================================================================================================================================================
con_timestamp "0"
cl_mainmenu_safemode 1; wait 90; cl_mainmenu_safemode 0
//======================================================================================================================================================================================================================
// Makes sure safemode and queuemode are reset if the menu is closed with the esacape key
// UPDATE: No longer works after the 2024 summer update, now using "gameui_preventescape" to get around the problem
//======================================================================================================================================================================================================================
// alias "gameui_hide"						"escape; cl_mainmenu_safemode 0; mat_queue_mode -1"

//======================================================================================================================================================================================================================
// Easier unlog alias
//======================================================================================================================================================================================================================
alias "console_unlog"						"con_logfile console.log"

//======================================================================================================================================================================================================================
// Execute all customization files
//======================================================================================================================================================================================================================
exec maxihud_customization_general
exec maxihud_customization_colors
exec maxihud_customization_fonts
exec maxihud_customization_crosshairs
exec maxihud_customization_streamer
exec maxihud_customization_reset

//======================================================================================================================================================================================================================
// Execute first HUD launch setup
//======================================================================================================================================================================================================================
alias "maxihud_firstrun" "exec maxihud_first_run"
exec maxihud/maxihud_setup.txt
maxihud_firstrun